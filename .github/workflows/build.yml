name: Build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install arduino-cli
        run: |
          curl -fsSL https://raw.githubusercontent.com/arduino/arduino-cli/master/install.sh | BINDIR=/usr/local/bin sh
          arduino-cli version

      - name: Setup ESP32 core
        run: |
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32@2.0.17

      - name: Install libraries
        run: |
          arduino-cli lib install "autowp-mcp2515" || \
          git clone --depth 1 https://github.com/autowp/arduino-mcp2515.git "$HOME/Arduino/libraries/arduino-mcp2515"

      - name: Prepare sketch folder
        run: |
          SKETCH="T2CAN-Universal-v3.30.3-LP_YL"
          mkdir -p "$SKETCH"
          cp *.ino "$SKETCH"/ 2>/dev/null || true
          cp *.cpp "$SKETCH"/ 2>/dev/null || true
          cp *.h   "$SKETCH"/ 2>/dev/null || true

      - name: Compile sketch
        run: |
          SKETCH="T2CAN-Universal-v3.30.3-LP_YL"
          arduino-cli compile \
            --fqbn esp32:esp32:esp32s3:FlashSize=16M,PSRAM=opi,USBMode=hwcdc,CDCOnBoot=cdc \
            --build-property compiler.cpp.extra_flags=-fpermissive \
            --output-dir build \
            "$SKETCH"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: |
            build/*.bin
            build/*.uf2
            build/*.elf
          if-no-files-found: warn
